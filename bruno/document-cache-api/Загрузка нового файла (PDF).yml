info:
  name: Загрузка нового файла (PDF)
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}:{{port}}/api/docs"
  body:
    type: multipart-form
    data:
      - name: meta
        type: text
        value: '{"name":"exp.pdf","file":true,"public":false,"token":"{{token}}","mime":"application/pdf","grant":[]}'
      - name: json
        type: text
        value: ""
        disabled: true
      - name: file
        type: file
        value:
          - D:\File for cash service\exp.pdf
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
