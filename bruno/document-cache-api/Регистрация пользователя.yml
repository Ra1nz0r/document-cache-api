info:
  name: Регистрация пользователя
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}:{{port}}/api/register"
  body:
    type: form-urlencoded
    data:
      - name: token
        value: local-dev-admin-token
      - name: login
        value: testuser3
      - name: pswd
        value: Testpass3!
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
