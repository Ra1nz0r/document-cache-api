info:
  name: Аутентификация
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}:{{port}}/api/auth"
  body:
    type: form-urlencoded
    data:
      - name: login
        value: testuser3
      - name: pswd
        value: Testpass3!
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body?.response?.token) {
          bru.setEnvVar("token", res.body.response.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
