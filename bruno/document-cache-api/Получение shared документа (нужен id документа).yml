info:
  name: Получение shared документа (нужен id документа)
  type: http
  seq: 13

http:
  method: GET
  url: "{{url}}:{{port}}/api/docs/{{document_id}}?token={{token}}"
  params:
    - name: token
      value: "{{token}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
