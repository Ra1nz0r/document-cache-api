---
version: "2"

sql:
  - engine: "postgresql"
    queries:
      - "./internal/database/queries/users.sql"

    schema:
      - "./internal/database/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "./internal/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_exact_table_names: false
