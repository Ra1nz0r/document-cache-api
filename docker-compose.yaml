services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: document_cache
      POSTGRES_PASSWORD: document_cache
      POSTGRES_DB: document_cache
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_cache -d document_cache"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools", "app"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://document_cache:document_cache@postgres:5432/document_cache?sslmode=disable
    command: ["up"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DOC_CACHE_SERVER_HOST: "0.0.0.0"
      DOC_CACHE_SERVER_PORT: "8080"
      DOC_CACHE_SERVER_SHUTDOWN_TIMEOUT: "10s"

      DOC_CACHE_DATABASE_DSN: "postgres://document_cache:document_cache@postgres:5432/document_cache?sslmode=disable"

      DOC_CACHE_AUTH_ADMIN_TOKEN: "${DOC_CACHE_AUTH_ADMIN_TOKEN:-local-dev-admin-token}"
      DOC_CACHE_AUTH_SESSION_TTL: "24h"

      DOC_CACHE_STORAGE_DIR: "/app/data/files"
      DOC_CACHE_STORAGE_MAX_UPLOAD_SIZE: "10485760"

      DOC_CACHE_CACHE_MAX_ENTRIES: "1000"
      DOC_CACHE_CACHE_MAX_BYTES: "67108864"

      DOC_CACHE_LOG_LEVEL: "info"
      DOC_CACHE_LOG_TO_FILE: "false"
    ports:
      - "8080:8080"
    volumes:
      - document_files:/app/data/files
    stop_grace_period: 15s

volumes:
  postgres_data:
  document_files:
