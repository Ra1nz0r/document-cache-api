services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: document_cache
      POSTGRES_PASSWORD: document_cache
      POSTGRES_DB: document_cache
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_cache -d document_cache"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://document_cache:document_cache@postgres:5432/document_cache?sslmode=disable
    command: ["up"]

volumes:
  postgres_data:
